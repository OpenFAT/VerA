# The reference tools from `nix develop .#external` on VerA's output, and the
# VAMS Conformance Suite through its `conform` harness. A known conformance
# failure is a line of tools/vera.xfail; a listed test that passes (XPASS)
# fails the job.
name: external

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# The merge tier: a newer push to a pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # tools/external_analog.py: VerA's `--emit-osdi` libraries in ngspice
  # against hand-derived values (tests/osdi). Every simulator run is capped
  # (VERA_EXTERNAL_TIMEOUT seconds), so a deck that never converges FAILs by
  # name instead of eating the job's budget.
  external-analog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERA_EXTERNAL_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Build vera
        run: nix develop .#external -c zig build -Doptimize=ReleaseFast install
      - name: OSDI decks in ngspice
        run: |
          nix develop .#external -c python3 tools/external_analog.py --out external-out 2>&1 | tee external.txt
          exit "${PIPESTATUS[0]}"
      - name: Job summary
        if: always()
        run: |
          {
            echo '## OSDI decks in ngspice'
            echo '```'; tail -1 external.txt; echo '```'
            echo '### FAIL names'
            echo '```'; grep -E '^FAIL ' external.txt || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: external-analog
          path: |
            external.txt
            external-out/fail.txt

  # `zig build test-external`: VerA's output read by the reference tools.
  # --emit-verilog's modules get a verilator -Wall lint and an iverilog
  # testbench each (Ubuntu's verilator 5.020 has no rise/fall delays and
  # rejects them; nixpkgs' 5.050 is the version they are linted against) and
  # --emit-rtlil is read, proc'ed and checked by yosys.
  external-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Reference tools on VerA's output
        run: |
          nix develop .#external -c zig build test-external 2>&1 | tee external-tools.txt
          exit "${PIPESTATUS[0]}"
      - name: Job summary
        if: always()
        run: |
          {
            echo '## Reference tools on VerA output'
            echo '### FAIL names'
            echo '```'; grep -E '^FAIL ' external-tools.txt || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The VAMS Conformance Suite (tests/conformance): its Verilog, Verilog-A,
  # Verilog-AMS and Annex E tests and its external manifests (ivtest,
  # sv-tests, ISP RAS, OpenVAF, gnucap-modelgen, VA-Models), judged by its
  # `conform` harness. A known failure is a line of tools/vera.xfail.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Conformance suite
        run: nix develop .#external -c zig build -Doptimize=ReleaseFast conformance
      - name: Job summary
        if: always()
        run: |
          {
            echo '## Conformance suite'
            echo '```'; cut -f1 zig-out/conformance.tsv | sort | uniq -c; echo '```'
            echo '### FAIL and XPASS'
            echo '```'; grep -E '^(FAIL|XPASS)' zig-out/conformance.tsv || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conformance
          path: zig-out/conformance.tsv
