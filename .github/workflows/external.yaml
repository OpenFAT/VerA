# The external suites, every reference tool from `nix develop .#external`
# (the reference tools of `.#benchmarking`, without its GPU toolchains).
# Each gates by NAME: a disagreement passes only when
# a row of its suite's TRIAGE.md (tests/fixtures/external/<suite>/) names it
# (the conformance job: a line of tools/vera.xfail)
# with a verdict, and a row that names nothing is STALE and fails too, as an
# XPASS does. Upstream sources are fetched at their pinned commits into
# .zig-cache/external, never committed.
name: external

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Analog (tools/external_analog.py): VerA's `--emit-osdi` libraries in
  # ngspice against hand-derived values, OpenVAF-Reloaded, the CMC and TU
  # Dresden QA references and Xyce. One job per suite, side by side; inside a
  # job a model's QA tests run one per CPU, and every simulator run is capped
  # (VERA_EXTERNAL_TIMEOUT seconds), so a deck that never converges FAILs by
  # name instead of eating the job's budget.
  external-analog:
    name: external-analog (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ["selftest osdi", va-models, cmcqa, hicum-qa, xyce]
    env:
      VERA_EXTERNAL_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build vera
        run: nix develop .#external -c zig build -Doptimize=ReleaseFast install
      - name: External analog suite ${{ matrix.suite }}
        run: |
          nix develop .#external -c python3 tools/external_analog.py ${{ matrix.suite }} --out external-out 2>&1 | tee external.txt
          exit "${PIPESTATUS[0]}"
      - name: Job summary
        if: always()
        run: |
          {
            echo '## External analog suite ${{ matrix.suite }}'
            echo '```'; tail -1 external.txt; echo '```'
            echo '### FAIL and STALE names'
            echo '```'; grep -E '^(FAIL|STALE) ' external.txt || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-analog-${{ strategy.job-index }}
          path: |
            external.txt
            external-out/fail.txt

  # VAMPyRE (tools/external_vampyre.py): the CMC's Verilog-A rule checker and
  # VerA on the same compact models, on the findings both make (hidden state,
  # integer division by a divisor that may be zero). Every disagreement is a
  # row of tests/fixtures/external/vampyre/TRIAGE.md, gated by name.
  external-vampyre:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.18.0-dev.349+d924f83bf
      - name: VAMPyRE against VerA
        run: |
          zig build test-vampyre 2>&1 | tee vampyre.txt
          exit "${PIPESTATUS[0]}"
      - name: Job summary
        if: always()
        run: |
          {
            echo '## VAMPyRE against VerA'
            echo '```'; grep -E '^vampyre:' vampyre.txt || true; echo '```'
            echo '### FAIL and STALE names'
            echo '```'; grep -E '^(FAIL|STALE) ' vampyre.txt || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The VAMS Conformance Suite (tests/conformance): its Verilog, Verilog-A,
  # Verilog-AMS and Annex E tests and its external manifests (ivtest,
  # sv-tests, ISP RAS, OpenVAF, gnucap-modelgen, VA-Models), judged by its
  # `conform` harness. A known failure is a line of tools/vera.xfail.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - name: Conformance suite
        run: nix develop .#external -c zig build -Doptimize=ReleaseFast conformance
      - name: Job summary
        if: always()
        run: |
          {
            echo '## Conformance suite'
            echo '```'; cut -f1 zig-out/conformance.tsv | sort | uniq -c; echo '```'
            echo '### FAIL and XPASS'
            echo '```'; grep -E '^(FAIL|XPASS)' zig-out/conformance.tsv || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: zig-out/conformance.tsv
