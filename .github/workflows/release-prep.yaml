# The first step of a release (CONTRIBUTING.md "A release"), run here so no
# maintainer measures the score on a laptop: `conformance.py --changelog`
# bumps the version literals, measures the VAMS Conformance Suite and dates
# CHANGELOG.md, the doc transcript that prints the version is re-blessed, and
# the commit goes to main through a pull request like any other change.
# publish.yaml re-measures the same number on the tag and refuses a mismatch.
#
# A pull request opened with GITHUB_TOKEN starts no workflow, so this job
# dispatches the required checks on its branch; a maintainer approves those
# runs and then the pull request, as for publish.yaml's sources.json.
name: release-prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'vX.Y.Z'
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          submodules: true  # tests/conformance: the suite it measures
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Bump, measure and date the CHANGELOG
        run: nix develop .#external -c python3 tools/conformance.py --changelog "$VERSION"
      - name: Re-bless the transcript that prints the version
        run: |
          nix develop .#docs -c zig build -Doptimize=ReleaseFast -j2 install
          nix develop .#docs -c python3 tools/doctest.py --update
      - name: Pull request, gated, auto-merged
        run: |
          branch="release/${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "release: ${VERSION}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "release: ${VERSION}" \
            --body "Generated by release-prep.yaml: \`conformance.py --changelog ${VERSION}\` and \`doctest.py --update\` on main. Tag the merge commit \`${VERSION}\` to publish."
          for w in test.yaml cross.yaml conformance.yaml external.yaml nix.yaml; do
            gh workflow run "$w" --ref "$branch"
          done
          gh pr merge "$branch" --auto --merge
