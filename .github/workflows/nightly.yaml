# The nightly tier: the slow evidence the merge gate cannot afford.
#
#   perturb   every check run with its want moved by 0.1%: a LOOSE check
#             cannot see an error that size (L2b)
#   certify   every Jacobian entry against a central difference (L4a)
#   determinism  every fixture's --emit-zig three times, byte-compared (L11)
#   sweep     the footprint and speed scaling table (reports, never gates)
#
# GitHub disables a schedule after 60 days without repository activity: a
# quiet stretch needs one workflow_dispatch run, or the nightly stops.
name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true  # tests/conformance: the fixtures
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Perturbed run (L2b)
        continue-on-error: true
        run: |
          nix develop -c zig build -Doptimize=ReleaseFast suite -- --perturb 2> /tmp/perturb.txt | tail -3
          status="${PIPESTATUS[0]}"
          grep '^LOOSE ' /tmp/perturb.txt | sed 's|^LOOSE .*/tests/conformance/tests/|LOOSE |' | sort > /tmp/loose.txt || true
          exit "$status"

      - name: Derivative certificate (L4a)
        continue-on-error: true
        run: |
          nix develop -c zig build -Doptimize=ReleaseFast suite -- --certify 2> /tmp/certify.txt | tail -3
          status="${PIPESTATUS[0]}"
          grep -E '^fd_check FAIL|^FAIL ' /tmp/certify.txt > /tmp/fd-failures.txt || true
          exit "$status"

      - name: Coverage-guided fuzzing, bounded (L6)
        continue-on-error: true
        run: |
          nix develop -c zig build fuzz --fuzz=200K 2>&1 | tail -20
          exit "${PIPESTATUS[0]}"

      # L11: every .va fixture's --emit-zig twice from the root and once from
      # another cwd, byte-compared. A difference is nondeterminism in codegen,
      # fixed at its order, never in the test.
      - name: Determinism (L11)
        continue-on-error: true
        run: |
          nix develop -c zig build -Doptimize=ReleaseFast install
          nix develop -c python3 tools/conformance.py determinism zig-out/bin/vera

      - name: Footprint and speed sweep (reports)
        continue-on-error: true
        run: |
          nix develop -c zig build -Doptimize=ReleaseFast suite -- --sweep 2>&1 | tee /tmp/sweep.txt
          { echo '## Footprint and speed sweep'; echo '```'; cat /tmp/sweep.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        run: |
          {
            echo '## LOOSE checks (want moved 0.1%, still ok=1)'
            echo '```'; wc -l < /tmp/loose.txt 2>/dev/null; head -50 /tmp/loose.txt 2>/dev/null; echo '```'
            echo '## Derivative certificate failures'
            echo '```'; head -50 /tmp/fd-failures.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-evidence
          path: |
            /tmp/loose.txt
            /tmp/fd-failures.txt
