# Every tag is a release, and every release carries the measured conformance
# number. The number is NOT typed into the release body here — it is re-measured
# on this runner and diffed against what CHANGELOG.md claims, so a tag cannot
# ship a stale percentage.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # tests/conformance: `--check` reads the ledgers
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.18.0-dev.349+d924f83bf

      # Fails the release if CHANGELOG.md's entry for this tag disagrees with
      # what the tree measures. This is the whole gate: v1.0.0 is defined
      # as four measures, and a release that misreports one of them is
      # worse than no release.
      - name: Verify CHANGELOG matches the tree
        run: python3 tools/conformance.py --check "${GITHUB_REF_NAME}"

      # Zig cross-compiles, so this is a loop on one runner and not a job matrix
      # — five runners would re-run `--check` five times to produce one release.
      - name: Build and package every target
        run: |
          set -euo pipefail
          for t in x86_64-linux-gnu aarch64-linux-gnu x86_64-macos aarch64-macos x86_64-windows; do
            echo "::group::$t"
            zig build -Dtarget="$t" -Doptimize=ReleaseFast install --prefix "out/$t"
            exe=vera; [[ "$t" == *windows* ]] && exe=vera.exe
            tar czf "vera-${GITHUB_REF_NAME}-${t}.tar.gz" -C "out/$t/bin" "$exe"
            echo "::endgroup::"
          done
          sha256sum vera-*.tar.gz | tee SHA256SUMS

      # The release body is the CHANGELOG section for this tag, verbatim — the
      # same table --check just confirmed.
      - name: Extract the CHANGELOG section
        run: |
          sed -n "/^## ${GITHUB_REF_NAME//./\\.} /,/^## v.*—/p" CHANGELOG.md \
            | sed '$ { /^## v/d }' > BODY.md
          cat BODY.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: BODY.md
          files: |
            vera-*.tar.gz
            SHA256SUMS

  # sources.json is what `nix build '.#"<version>"'` installs, so the release
  # just uploaded is added to it on main. Committed, not opened as a PR: the
  # file is derived mechanically from the assets and SHA256SUMS the job above
  # verified and uploaded, so there is nothing to review, and a PR opened with
  # GITHUB_TOKEN runs no workflows anyway. A GITHUB_TOKEN push triggers no
  # workflow either, so this cannot loop.
  sources:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Regenerate sources.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update-sources.py
      - name: Commit to main
        run: |
          git diff --quiet sources.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "nix: sources.json for ${GITHUB_REF_NAME}" -- sources.json
          git push origin HEAD:main
