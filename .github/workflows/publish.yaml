# Every tag is a release, and every release carries the measured conformance
# number. The number is NOT typed into the release body here — it is re-measured
# on this runner and diffed against what CHANGELOG.md claims, so a tag cannot
# ship a stale percentage.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The merge gate, reused: a tag on a commit that never went green ships nothing.
  gate:
    uses: ./.github/workflows/test.yaml

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.18.0-dev.349+d924f83bf
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      # Fails the release if CHANGELOG.md's score line for this tag is not what
      # the VAMS Conformance Suite measures on this tree, per language: a
      # release that misreports its score is worse than no release.
      - name: Verify CHANGELOG's score matches the tree
        run: nix develop .#external -c python3 tools/conformance.py --check "${GITHUB_REF_NAME}"

      # Zig cross-compiles, so this is a loop on one runner and not a job matrix
      # — five runners would re-run `--check` five times to produce one release.
      - name: Build and package every target
        run: |
          set -euo pipefail
          for t in x86_64-linux-gnu aarch64-linux-gnu x86_64-macos aarch64-macos x86_64-windows; do
            echo "::group::$t"
            zig build -Dtarget="$t" -Doptimize=ReleaseFast install --prefix "out/$t"
            exe=vera; [[ "$t" == *windows* ]] && exe=vera.exe
            tar czf "vera-${GITHUB_REF_NAME}-${t}.tar.gz" -C "out/$t/bin" "$exe"
            echo "::endgroup::"
          done
          zig build -Dtarget=wasm32-wasi -Doptimize=ReleaseSmall install --prefix out/wasm
          cp out/wasm/bin/vera.wasm "vera-${GITHUB_REF_NAME}.wasm"
          sha256sum vera-*.tar.gz vera-*.wasm | tee SHA256SUMS

      # .deb, .rpm and Arch .pkg.tar.zst from the Linux prefixes, plus the AUR
      # PKGBUILD and the Homebrew formula over the tarballs (tools/package.sh).
      # Each x86_64 package is installed by its own package manager in its
      # distribution and must print this version before anything is uploaded.
      - name: Distribution packages
        run: |
          set -euo pipefail
          nix shell nixpkgs#nfpm -c tools/package.sh "${GITHUB_REF_NAME}"
          tools/package.sh --check "${GITHUB_REF_NAME}"
          sha256sum vera_*.deb vera-*.rpm vera-*.pkg.tar.zst PKGBUILD vera.rb | tee -a SHA256SUMS

      # The release body is the CHANGELOG section for this tag, verbatim — the
      # same table --check just confirmed.
      - name: Extract the CHANGELOG section
        run: |
          sed -n "/^## ${GITHUB_REF_NAME//./\\.} /,/^## v.*—/p" CHANGELOG.md \
            | sed '$ { /^## v/d }' > BODY.md
          cat BODY.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: BODY.md
          files: |
            vera-*.tar.gz
            vera-*.wasm
            vera_*.deb
            vera-*.rpm
            vera-*.pkg.tar.zst
            PKGBUILD
            vera.rb
            SHA256SUMS

  # sources.json is what `nix build '.#"<version>"'` installs, so the release
  # just uploaded is added to it on main, through a pull request like any
  # other change: main's ruleset admits nothing else. A pull request opened
  # with GITHUB_TOKEN starts no workflow, and the checks this job dispatches on
  # its branch are not attached to the PR, so the ruleset still blocks it: a
  # maintainer closes it and reopens it from the same branch (#88, #90 -> #92),
  # and its pull_request checks then run and auto-merge lands it.
  sources:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Regenerate sources.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update-sources.py
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: The new sources.json builds and runs
        run: git diff --quiet sources.json || nix flake check -L
      - name: Pull request, gated, auto-merged
        run: |
          git diff --quiet sources.json && exit 0
          branch="sources/${GITHUB_REF_NAME}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m "nix: sources.json for ${GITHUB_REF_NAME}" -- sources.json
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "nix: sources.json for ${GITHUB_REF_NAME}" \
            --body "Generated by publish.yaml from the ${GITHUB_REF_NAME} assets and SHA256SUMS; \`nix flake check\` passed on it."
          for w in test.yaml cross.yaml conformance.yaml external.yaml nix.yaml; do
            gh workflow run "$w" --ref "$branch"
          done
          gh pr merge "$branch" --auto --squash

  # The Homebrew formula the release attached, installed through a local tap on
  # macOS from the uploaded tarballs and run by its own `test do`. With a
  # HOMEBREW_TAP_TOKEN secret (contents: write on OmarSiwy/homebrew-vera) the
  # formula is pushed to that tap: `brew install OmarSiwy/vera/vera`.
  homebrew:
    needs: release
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Install and test the formula
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p vera.rb
          brew tap-new --no-git vera/local
          cp vera.rb "$(brew --repository vera/local)/Formula/vera.rb"
          brew install vera/local/vera
          brew test vera/local/vera
          vera --version
      - name: Push to OmarSiwy/homebrew-vera
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/OmarSiwy/homebrew-vera.git" tap
          mkdir -p tap/Formula && cp vera.rb tap/Formula/vera.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/vera.rb
          git diff --cached --quiet || { git commit -m "vera ${GITHUB_REF_NAME}"; git push; }

  # The AUR package the release attached: makepkg in Arch downloads the
  # uploaded tarball, checks it against the PKGBUILD's sha256, and the package
  # it builds must install and run. With an AUR_SSH_PRIVATE_KEY secret (an AUR
  # account's key) the PKGBUILD and its .SRCINFO are pushed to vera-bin.
  aur:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Build, install and run vera-bin
        run: |
          set -euo pipefail
          mkdir aur && cd aur
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p PKGBUILD
          docker run --rm -v "$PWD:/aur" archlinux:latest sh -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder && chown -R builder /aur
            su builder -c "cd /aur && makepkg --noconfirm && makepkg --printsrcinfo > .SRCINFO"
            pacman -U --noconfirm /aur/vera-bin-*.pkg.tar.zst >/dev/null
            vera --version'
      - name: Push to the AUR
        if: env.AUR_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$AUR_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/vera-bin.git vera-bin
          cp aur/PKGBUILD aur/.SRCINFO vera-bin/
          cd vera-bin
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -m "vera-bin ${GITHUB_REF_NAME#v}"; git push; }
