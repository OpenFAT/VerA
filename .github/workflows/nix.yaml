# The flake, on a runner of each of its four systems: the source package,
# its smoke check (a resistor through `vera --check` in the sandbox) and the
# latest release binary's, all built by `nix flake check`.
name: nix

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# The merge tier: a newer push to a pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux, aarch64-linux, aarch64-darwin, x86_64-darwin
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: nix flake check
        run: nix flake check -L
      - name: nix build .#default
        run: nix build -L .#default
