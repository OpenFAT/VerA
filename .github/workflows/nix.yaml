# The flake, on a runner of each of its four systems: the source package,
# its smoke check (a resistor through `vera --check` in the sandbox) and the
# latest release binary's, all built by `nix flake check`.
name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux, aarch64-linux, aarch64-darwin, x86_64-darwin
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
      - name: nix build .#default
        run: nix build -L .#default
