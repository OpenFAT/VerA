# Cross-platform builds hold because VerA calls no OS but through `std`
# (tests/unit.zig's exhaustive_tests, the portability guard; src/dynlib.zig is the one
# allowlisted file). `build-all` compiles every artifact `test` builds, the
# emitted test devices and the VPI host and applications included, for the
# target, and runs none: a foreign binary cannot run on this runner.
name: cross

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# The merge tier: a newer push to a pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-gnu, aarch64-linux-gnu, x86_64-macos, aarch64-macos, x86_64-windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true  # tests/conformance: the fixtures `build-all` embeds and compiles
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.18.0-dev.349+d924f83bf
      - name: Build every artifact for ${{ matrix.target }}
        run: zig build build-all -Dtarget=${{ matrix.target }}

  # vera as WebAssembly, for a browser or any WASI host. The front end and every
  # --emit-* that only writes text run there; anything that spawns `zig`
  # (--check's build, --run, --emit-so, --emit-exe) cannot. The oracle is the
  # native vera: the same fixture's --emit-zig must be byte-identical.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Build vera.wasm and native vera
        run: |
          nix develop -c zig build -Dtarget=wasm32-wasi -Doptimize=ReleaseSmall install --prefix out/wasm
          nix develop -c zig build install --prefix out/native
      - name: vera.wasm and native vera emit the same Zig
        run: |
          set -euo pipefail
          f=tests/beh_verilog/rc_charge.va
          nix shell nixpkgs#wasmtime -c wasmtime --dir . out/wasm/bin/vera.wasm --allow=W0650 --emit-zig "$f" -o wasm.zig
          out/native/bin/vera --allow=W0650 --emit-zig "$f" -o native.zig
          cmp wasm.zig native.zig

  # What publish.yaml's "Distribution packages" step does, on every change, so a
  # package that would not install fails here and not at a tag: the .deb, .rpm
  # and Arch package of build.zig.zon's version, each installed by its own
  # package manager in its distribution, plus the PKGBUILD and the formula.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Build the release targets and their packages
        run: |
          set -euo pipefail
          v=$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon)
          for t in x86_64-linux-gnu aarch64-linux-gnu x86_64-macos aarch64-macos; do
            nix develop -c zig build -Dtarget="$t" -Doptimize=ReleaseFast install --prefix "out/$t"
            tar czf "vera-v$v-$t.tar.gz" -C "out/$t/bin" vera
          done
          nix shell nixpkgs#nfpm -c tools/package.sh "$v"
          tools/package.sh --check "$v"
