# One execution report joins fixture, host, reference and VPI evidence.
# The native backend, external HDL tools and size sweep remain separate checks.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # tests/conformance: the fixtures and VerA's ledgers
      - uses: cachix/install-nix-action@v31
      - name: Audit and evidence accounting tests
        run: |
          nix develop -c python3 tools/conformance.py selftest
          nix develop -c python3 tests/host.py selftest
      - name: Build-step inventory
        run: nix develop -c python3 tools/conformance.py steps
      - name: Fixture cites against the requirement ledger
        run: nix develop -c python3 tools/conformance.py lint-cites

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # tests/conformance: the fixtures and VerA's ledgers
      - uses: cachix/install-nix-action@v31
      - name: Execute suites and measure coverage
        run: nix develop -c python3 tools/conformance.py run --jobs=2 --output=/tmp/vera-conformance
      - name: Fixture verdict ratchet
        if: always()
        shell: bash
        run: |
          runs=(/tmp/vera-conformance/*)
          python3 tools/conformance.py ratchet --verdicts="${runs[0]}/ams.tsv"
      - name: Publish the measured summary
        if: always()
        shell: bash
        run: |
          runs=(/tmp/vera-conformance/*)
          mkdir -p /tmp/vera-measured
          cp "${runs[0]}/report.md" /tmp/vera-measured/measured.md
          cp "${runs[0]}/report.json" "${runs[0]}"/*.log /tmp/vera-measured/
          cat /tmp/vera-measured/measured.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-results
          path: /tmp/vera-conformance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured
          path: /tmp/vera-measured/

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # tests/conformance: the fixtures and VerA's ledgers
      - uses: cachix/install-nix-action@v31
      - name: All digital transcripts through emitted executables
        run: nix develop -c zig build test-devices -- --native

  # --emit-verilog's modules: verilator -Wall lint and an iverilog testbench
  # each. Ubuntu's verilator (5.020) has no rise/fall delays (RISEFALLDLY)
  # and rejects the emitted modules; nixpkgs' (5.050) is the version they are
  # linted against locally.
  emit-verilog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # tests/conformance: the fixtures and VerA's ledgers
      - uses: cachix/install-nix-action@v31
      - name: Behavioural Verilog simulates and lints
        run: nix develop -c zig build test-beh-verilog

  # The footprint and speed scaling table: generated-device byte counts and
  # MIR footprint against fixture size. It compiles nothing from
  # tests/conformance, so it is fast and it is the size-regression signal.
  # Reports, never gates.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # tests/conformance: the fixtures and VerA's ledgers
      - uses: cachix/install-nix-action@v31
      - name: Benchmark sweep, footprint and speed
        run: |
          nix develop -c zig build benchmark -- --sweep 2>&1 | tee /tmp/sweep.txt
          { echo '## Footprint and speed sweep'; echo '```'; cat /tmp/sweep.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
