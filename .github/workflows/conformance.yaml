# The fixture runner's and the harness's own checks. The conformance suite
# itself (`zig build conformance`, the suite's `conform` harness) is
# external.yaml's; the size sweep is the nightly's.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# The merge tier: a newer push to a pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true  # tests/conformance: the fixtures
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Harness selftests
        run: |
          nix develop -c python3 tools/conformance.py selftest
          nix develop -c python3 tests/host.py selftest

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true  # tests/conformance: the fixtures
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: AMS fixtures
        run: nix develop -c zig build -Doptimize=ReleaseFast suite -- ams
      - name: Digital fixtures
        if: always()
        run: nix develop -c zig build -Doptimize=ReleaseFast suite -- devices
      - name: VPI fixtures
        if: always()
        run: nix develop -c zig build -Doptimize=ReleaseFast suite -- vpi

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true  # tests/conformance: the fixtures
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: All digital transcripts through emitted executables
        run: nix develop -c zig build suite -- devices --native
