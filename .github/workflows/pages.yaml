# The website (https://omarsiwy.github.io/VerA/): the user documentation
# (docs/, mdBook) at / and the conformance and speed report at /report/.
#
# It runs when conformance.yaml finishes on main, whatever its verdict, so
# the book's conformance page carries that run's measures block (`measured`)
# and the site follows main commit by commit. On a pull request it builds the
# book and checks its transcripts, and deploys nothing.
name: pages

on:
  workflow_run:
    workflows: [conformance]
    types: [completed]
    branches: [main]
  pull_request:
    paths: [docs/**, tools/doctest.py, .github/workflows/pages.yaml]
  workflow_dispatch:

# One deployment at a time, the newest last; never cancel one halfway.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  # Every transcript a page shows is re-run against this commit's vera, and a
  # page that no longer matches what vera prints fails the job
  # (tools/doctest.py). One heavy build at a time, two jobs wide (-j2): the
  # runner's RAM. It waits for `report`, whose charts conformance.md
  # includes; on a pull request `report` is skipped and the book builds
  # with placeholders.
  docs:
    needs: report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Build vera
        run: nix develop .#docs -c zig build -Doptimize=ReleaseFast -j2 install
      - name: Transcripts match vera (gate)
        run: nix develop .#docs -c python3 tools/doctest.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        with:
          name: measured
          path: docs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.report.result == 'success'
        with:
          name: charts
          path: specification/img
      - name: Build the book (gate)
        run: |
          test -s docs/measured.md || echo '(the conformance workflow did not measure this run)' > docs/measured.md
          mkdir -p specification/img
          for f in conformance lrm-chapters ieee-chapters compile-time scaling model-build; do
            test -s "specification/img/$f.svg" || echo "($f.svg: not measured in this run)" > "specification/img/$f.svg"
          done
          nix develop .#docs -c mdbook build docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: book
          path: docs/book/

  # The conformance and speed report (tools/report.py): one self-contained
  # page with the measures, the clause-by-clause rule map, the gaps, and the
  # timing charts, re-measured from scratch in ReleaseFast. A published
  # record, not a gate. The charts reach the book as the `charts` artifact,
  # never as a commit: a generated file on main is untested by construction.
  report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OmarSiwy/ESPice
          path: arpice
          sparse-checkout: models
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.18.0-dev.349+d924f83bf
      - name: Generate report/
        run: |
          python3 tools/report.py --selftest
          python3 tools/report.py --models arpice/models --svg specification/img
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report
          path: report/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: charts
          path: specification/img/

  deploy:
    needs: [docs, report]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: book
          path: site
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: report
          path: site/report
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
